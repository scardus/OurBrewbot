; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = OurBrewbot
; native is test-only (see [env:native] below) and never buildable via
; plain `pio run`/`pio check` - keep it out of the default env set so those
; commands keep behaving exactly as before. Reach it with `-e native`.
default_envs = nodemcuv2

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
upload_port = COM6
monitor_port = COM6
monitor_speed = 115200
board_build.ldscript = eagle.flash.4m2m.ld
board_build.filesystem = littlefs
lib_deps =
	milesburton/DallasTemperature@^4.0.6
	paulstoffregen/OneWire@^2.3.8
	tzapu/WiFiManager@^2.0.17
	sui77/rc-switch@^2.6.4
	hmueller01/PubSubClient3@^3.3.0
	bblanchon/ArduinoJson@^7.4.3
	scardus/MicroMDNS@^0.1.0
; Heap-corruption tripwire (core umm_malloc). Adds guard bytes around every
; heap block and checks the block and its neighbours on each malloc, realloc
; and free. An overrun then panics at the culprit - logged as a DEFERRED
; "Crash detail: reason=254" with its stack - instead of surfacing weeks later
; as a wild pointer inside the WiFi driver. Costs ~10 bytes per live
; allocation. The LITE variant is used because the full UMM_POISON_CHECK scans
; the whole heap with interrupts off on every allocation.
build_flags =
	-D UMM_POISON_CHECK_LITE
; Stack-overrun tripwire, for our own source files only (not the core or
; libraries). The compiler puts a check value next to the local buffers in
; each function and tests it on return. An overrun then reboots at once -
; logged as a DEFERRED "Crash detail: reason=253" with its stack - instead of
; corrupting the WiFi SDK's stack, which sits just below ours.
build_src_flags =
	-fstack-protector-strong
; --inline-suppr makes cppcheck honour `// cppcheck-suppress <id>` comments in
; the source. Without it those comments are silently ignored, so any
; suppression has to be justified in a comment next to the code it applies to
; rather than hidden in a global list here.
check_flags =
	cppcheck: --inline-suppr --suppress=*:*/.pio/* -DARDUINOJSON_BEGIN_PUBLIC_NAMESPACE= -DARDUINOJSON_END_PUBLIC_NAMESPACE= -DARDUINOJSON_BEGIN_PRIVATE_NAMESPACE= -DARDUINOJSON_END_PRIVATE_NAMESPACE=
; This is the production build/upload env and the default_envs target -
; it must NEVER upload or run tests on its own (a bare `pio test` defaults
; to default_envs and, for an embedded env, uploads+runs by default -
; without this, that command would silently flash the live device).
; On-device tests live in [env:nodemcuv2_test] below instead, which is
; reachable only via an explicit `-e nodemcuv2_test`.
test_ignore = *

; On-device Unity tests - NOT in default_envs, only reachable via an
; explicit `pio test -e nodemcuv2_test --upload-port COM6`. That command
; REPLACES the running firmware on the device with a test runner for the
; duration of the run - only do this when the fermenter isn't mid-batch,
; and never without explicit go-ahead. See Phase B in the unit-testing plan.
[env:nodemcuv2_test]
extends = env:nodemcuv2
test_ignore =
test_filter = test_device_*

; Native (host) unit tests - no board, no hardware, run with `pio test -e native`.
; Tests the real OurBrewbot/*.cpp sources directly against a minimal set of
; Arduino-core stand-ins (test/stubs/) rather than linking the actual
; ESP8266 framework/libraries.
[env:native]
platform = native
lib_deps =
	bblanchon/ArduinoJson@^7.4.3
build_flags =
	-I test/stubs
	; ArduinoJson only enables its Arduino String converter/reader under
	; #ifdef ARDUINO (see its Configuration.hpp), which the native env never
	; defines. iSpindel.cpp's handleiSpindelPost() calls
	; deserializeJson(doc, body) with a String& and doc["ID"].as<String>() -
	; force the macro on so those compile against test/stubs/Arduino.h's
	; String stand-in instead of silently falling back to something else.
	-D ARDUINOJSON_ENABLE_ARDUINO_STRING=1
test_filter = test_native_*
; Only ever built via `pio test -e native`, which pulls in the specific
; OurBrewbot/*.cpp each test #includes directly (see test/test_native_*).
; Excluded from src_dir here so a plain `pio run` / `pio check` (no -e) -
; which builds/checks every environment - doesn't also try to compile the
; whole ESP8266 production tree (WiFi, mDNS, etc.) against the native stubs.
build_src_filter = -<*>

; The native tests again, built with AddressSanitizer + UndefinedBehavior-
; Sanitizer (see test/sanitize.py) so any out-of-bounds read or write, use
; after free or integer overflow in our code fails the test that caused it.
; Linux only - run from WSL: `pio test -e native_asan`.
[env:native_asan]
extends = env:native
extra_scripts = pre:test/sanitize.py