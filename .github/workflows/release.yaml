name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      # The tag and Version.h are kept in step by hand, so a mismatch is easy to
      # make - and it would publish a binary reporting a different version than
      # the release it hangs off. Fail before anything is built.
      - name: Check FW_VERSION matches the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          # POSIX sed rather than grep -oP, so the same command can be dry-run in
          # Git Bash on Windows, where grep's -P is unavailable in most locales.
          FW=$(sed -n 's/.*FW_VERSION[[:space:]]*"\([^"]*\)".*/\1/p' OurBrewbot/Version.h)
          echo "tag=$TAG firmware=$FW"
          if [ "$TAG" != "$FW" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match FW_VERSION \"$FW\" in OurBrewbot/Version.h"
            exit 1
          fi

      # Every release needs a news post on ourbrewbot.com. It is written before
      # the tag is pushed, as a draft (no date) called news/<tag>.md in the
      # website repo - see "News posts" in that repo's README. The release notes
      # below and the site's version.json link straight to it, which is why it
      # must be named after the tag. Fail before anything is built if it's
      # missing. The website repo is private, so this needs
      # WEBSITE_REBUILD_TOKEN, a fine-grained token with Contents: write on
      # OurBrewbot-Website only. The clone is reused by "Publish the news post".
      - name: Check there is a news post for this release
        env:
          WEBSITE_TOKEN: ${{ secrets.WEBSITE_REBUILD_TOKEN }}
        run: |
          if [ -z "$WEBSITE_TOKEN" ]; then
            echo "::error::WEBSITE_REBUILD_TOKEN is not set, so the news post for $GITHUB_REF_NAME can't be checked"
            exit 1
          fi
          git clone --depth 1 "https://x-access-token:${WEBSITE_TOKEN}@github.com/scardus/OurBrewbot-Website.git" "$RUNNER_TEMP/website"
          cd "$RUNNER_TEMP/website"
          POST="news/${GITHUB_REF_NAME}.md"
          if [ ! -f "$POST" ]; then
            echo "::error::No news post for $GITHUB_REF_NAME - add $POST to the website repo, then delete and push the tag again"
            exit 1
          fi
          if ! grep -q -E "^release:[[:space:]]*${GITHUB_REF_NAME}[[:space:]]*$" "$POST"; then
            echo "::error::$POST in the website repo has no \"release: $GITHUB_REF_NAME\" line"
            exit 1
          fi
          echo "News post: $POST"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      # A tag can point at any commit, including one that never went through CI,
      # so the release re-runs the same gates rather than assuming it did.
      - name: Run static analysis
        run: pio check --fail-on-defect=high

      - name: Run native unit tests
        run: pio test -e native

      - name: Build firmware
        run: pio run

      # platformio.ini pins exact versions, so this should match the locally
      # built and flashed binary. Recording what was actually linked keeps a
      # released binary traceable after the fact.
      - name: Record resolved library versions
        run: |
          # Written to a file first, and never allowed to fail the job: this is
          # decorative metadata, and a crash midway through writing the heredoc
          # would leave $GITHUB_ENV with an unterminated block.
          pio pkg list -e nodemcuv2 2>&1 | sed 's/\x1b\[[0-9;]*m//g' > libs.txt || true
          [ -s libs.txt ] || echo '(pio pkg list produced no output)' > libs.txt
          {
            echo 'LIBS<<PIOEOF'
            cat libs.txt
            echo PIOEOF
          } >> "$GITHUB_ENV"

      # The .elf ships too: Crash.cpp's RTC register/stack dumps can only be
      # turned back into function names with the exact ELF that built the binary,
      # and it exists nowhere else once the runner is torn down.
      - name: Stage release assets
        run: |
          cp .pio/build/nodemcuv2/firmware.bin OurBrewbot_${{ github.ref_name }}.bin
          cp .pio/build/nodemcuv2/firmware.elf OurBrewbot_${{ github.ref_name }}.elf

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: OurBrewbot ${{ github.ref_name }}
          # GitHub works out the correct previous tag and commit list itself, and
          # appends them below the body set here.
          generate_release_notes: true
          body: |
            ## OurBrewbot ${{ github.ref_name }}

            An overview of this release can be found on [the ourbrewbot.com website](https://ourbrewbot.com/news/#${{ github.ref_name }}).
            
            See the [README](https://github.com/scardus/OurBrewbot/blob/main/README.md) for more information.

            Flash `OurBrewbot_${{ github.ref_name }}.bin` over OTA. The `.elf` is only
            needed for decoding a crash stack trace produced by this exact build.

            <details><summary>Build dependencies</summary>

            ```
            ${{ env.LIBS }}
            ```

            </details>
          files: |
            OurBrewbot_${{ github.ref_name }}.bin
            OurBrewbot_${{ github.ref_name }}.elf

      # Publish this release's news post by giving it a date (UTC). Pushing that
      # to the website repo starts its Cloudflare build, which also picks up this
      # release for the installer and version.json. If the post already has a
      # date (a re-run release), it is left alone and an empty commit just
      # rebuilds the site.
      - name: Publish the news post
        run: |
          cd "$RUNNER_TEMP/website"
          # The post may have been edited while the firmware was building
          git pull --ff-only
          POST="news/${GITHUB_REF_NAME}.md"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if grep -q -E "^date:[[:space:]]*[0-9]" "$POST"; then
            git commit --allow-empty -m "Rebuild to publish firmware ${GITHUB_REF_NAME}"
          else
            # Drop an empty "date:" line if there is one, then add the date
            # on the line after the title
            sed -i -E '/^date:[[:space:]]*$/d' "$POST"
            sed -i "/^title:/a date: $(date -u '+%Y-%m-%d %H:%M')" "$POST"
            git add "$POST"
            git commit -m "Publish the news post for firmware ${GITHUB_REF_NAME}"
          fi
          # Try once more if the website repo changed since the pull above
          git push || (git pull --rebase && git push)
