name: PlatformIO Dependabot

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

# The action below opens pull requests, so the token needs write scope stated
# explicitly - inheriting the repository default breaks silently if that default
# is ever set to read-only.
permissions:
  contents: write
  pull-requests: write

jobs:
  update-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/platformio.ini') }}

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('**/platformio.ini') }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Test Build Current Project
        run: pio run

      # Third-party Docker action holding a write-capable token, so it is pinned
      # to a commit SHA rather than the mutable v1 tag. Bump the SHA and the
      # version comment together.
      - name: Run PlatformIO Dependabot
        uses: peterus/platformio_dependabot@ee459e446a090c4894b1354a3b85bc064797fd2b # v1.2.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # The action above is a Docker container action that runs as root and
      # writes into the mounted workspace (it installs/builds every env in
      # platformio.ini, including the native one, with no way to scope it
      # down - see action.yml). That leaves root-owned files behind, which
      # then breaks the later hashFiles() in the "Cache PlatformIO" step's
      # post-job save with a permission error. Hand the workspace back to
      # the runner user before the job ends.
      - name: Fix workspace ownership after Docker action
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
