<!DOCTYPE html>
<html>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width,initial-scale=1'>
  <title>BLE AT Console</title>
  <style>
    body{background:#1a1a2e;color:#e0e0e0;font-family:system-ui,sans-serif;padding:16px}
    h2{color:#e94560}
    a{color:#53d8fb}
    .info{background:#16213e;padding:12px;border-radius:6px;margin:12px 0;font-size:14px}
    .log{background:#0a0a1a;border:1px solid #333;border-radius:6px;padding:12px;margin:12px 0;font-family:monospace;font-size:13px;min-height:200px;max-height:400px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}
    .sent{color:#e94560;font-weight:bold}
    .recv{color:#53d8fb}
    .btn{display:inline-block;background:#e94560;color:#fff;padding:8px 16px;border-radius:4px;cursor:pointer;border:none;font-size:14px;margin:4px}
    .btn:hover{background:#c73650}
    .btn-at{background:#0f3460;color:#53d8fb;border:1px solid #53d8fb;padding:6px 12px;border-radius:4px;cursor:pointer;font-size:13px;margin:2px}
    .btn-at:hover{background:#1a4a8a}
    .at-row{display:flex;flex-wrap:wrap;margin:8px 0}
    .cmd-row{display:flex;gap:8px;margin:12px 0;align-items:center}
    .cmd-row input{flex:1;background:#0f3460;border:1px solid #444;color:#e0e0e0;padding:8px 12px;border-radius:4px;font-family:monospace;font-size:14px}
    .status{font-size:14px;margin:8px 0}
    .on{color:#4f4}
    .off{color:#f44}
    .btn,.btn-at,.cmd-row input{font-size:16px;min-height:44px;max-width:100%}
    .cmd-row{flex-wrap:wrap}
    .cmd-row input{min-width:0}
    a{display:inline-block;min-height:44px;padding:8px 0}
  </style>
</head>
<body>
  <h2>BLE AT Command Console</h2>
  <div class='info'>
    <p>Send AT commands to the HM-10 Bluetooth module. Tilt scanning is paused while this page is open.</p>
    <p>Common commands: AT (test), AT+VERS? (firmware), AT+ROLE? (role), AT+DISI? (iBeacon scan ~3s)</p>
  </div>
  <div class='status'>HM-10 on GPIO12/13 (D6/D7): <span id='st' class='on'>Connected</span></div>
  <div class='at-row'>
    <button class='btn-at' onclick="sendCmd('AT')">AT</button>
    <button class='btn-at' onclick="sendCmd('AT+VERS?')">AT+VERS?</button>
    <button class='btn-at' onclick="sendCmd('AT+ROLE?')">AT+ROLE?</button>
    <button class='btn-at' onclick="sendCmd('AT+IMME?')">AT+IMME?</button>
    <button class='btn-at' onclick="sendCmd('AT+DISI?')">AT+DISI?</button>
    <button class='btn-at' onclick="sendCmd('AT+ADDR?')">AT+ADDR?</button>
    <button class='btn-at' onclick="sendCmd('AT+BAUD?')">AT+BAUD?</button>
  </div>
  <div class='cmd-row'>
    <input type='text' id='cmd' placeholder='Type AT command...' onkeydown='if(event.key=="Enter")sendManual()'>
    <button class='btn' onclick='sendManual()'>Send</button>
    <button class='btn' onclick='clearLog()' style='background:#333'>Clear</button>
  </div>
  <div id='log' class='log'><span style='color:#888'>Waiting for data...</span></div>
  <script>
  var log=document.getElementById('log'),first=true;
  // Append console output and scroll to the newest entry.
  function appendLog(html){
    if(first){
      log.innerHTML='';
      first=false;
    }
    log.innerHTML+=html;
    log.scrollTop=log.scrollHeight;
  }
  // Display and send an AT command to the Bluetooth module.
  function sendCmd(c){
    appendLog('<div class="sent">&gt; '+c+'</div>');
    fetch('/ble/sniff/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cmd:c})})
      .catch(function(e){appendLog('<div style="color:#f44">Send error: '+e+'</div>')});
  }
  // Send the typed command and clear its input field.
  function sendManual(){
    var i=document.getElementById('cmd');
    if(i.value){
      sendCmd(i.value);
      i.value='';
    }
  }
  // Read Bluetooth console output and escape it before display.
  function poll(){
    fetch('/ble/sniff/poll')
      .then(function(r){return r.json()})
      .then(function(d){
        if(d.len>0){
          appendLog('<span class="recv">'+d.data.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</span>');
        }
      })
      .catch(function(){});
  }
  // Reset only the browser console display.
  function clearLog(){
    log.innerHTML='<span style="color:#888">Waiting for data...</span>';
    first=true;
  }
  setInterval(poll,300);
  </script>
  <br>
  <a href='/admin'>Back to Admin</a>
</body>
</html>
