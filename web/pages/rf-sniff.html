<!DOCTYPE html><html><head><meta charset='utf-8'><title>RF Sniffer</title><style>body{background:#1a1a2e;color:#e0e0e0;font-family:system-ui,sans-serif;padding:16px}h2{color:#e94560}a{color:#53d8fb}.info{background:#16213e;padding:12px;border-radius:6px;margin:12px 0;font-size:14px}.log{background:#0a0a1a;border:1px solid #333;border-radius:6px;padding:12px;margin:12px 0;font-family:monospace;font-size:13px;min-height:200px;max-height:400px;overflow-y:auto}.entry{padding:4px 0;border-bottom:1px solid #222}.code{color:#53d8fb;font-weight:bold;font-size:15px}.meta{color:#888;font-size:12px}.btn{display:inline-block;background:#e94560;color:#fff;padding:8px 16px;border-radius:4px;cursor:pointer;border:none;font-size:14px;margin:4px}.btn:hover{background:#c73650}.btn-off{background:#333;color:#888}.status{font-size:14px;margin:8px 0}.on{color:#4f4}.off{color:#f44}</style></head><body><h2>RF Code Sniffer</h2><div class='info'><p>Press buttons on your Dial remote. Received codes appear below.</p><p>You can also press 'Test Transmit' to verify the transmitter — if working, the receiver will pick up the transmitted code.</p></div><div class='status'>Receiver on GPIO14 (D5): <span id='st' class='on'>Listening...</span></div><button class='btn' onclick='testTx()'>Test Transmit (GPIO4)</button><button class='btn' onclick='clearLog()'>Clear Log</button><div id='log' class='log'><div style='color:#888'>Waiting for RF signals...</div></div><script>var log=document.getElementById('log'),first=true;function addEntry(d){if(first){log.innerHTML='';first=false;}var e=document.createElement('div');e.className='entry';e.innerHTML='<span class="code">'+d.code+' ('+d.hex+')</span> '+'<span class="meta">'+d.bits+'-bit, delay='+d.delay+'&mu;s, proto='+d.protocol+'</span>';log.insertBefore(e,log.firstChild);}function poll(){fetch('/rf/sniff/poll').then(function(r){return r.json()}).then(function(d){if(d.received)addEntry(d);}).catch(function(){});}function clearLog(){log.innerHTML='<div style="color:#888">Waiting for RF signals...</div>';first=true;}setInterval(poll,500);</script><br><a href='/admin'>Back to Admin</a></body></html>
