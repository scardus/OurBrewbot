#
# HACS prerequisites (install via HACS → Frontend before using this file):
#   • lovelace-plotly-graph-card https://github.com/dbuezas/lovelace-plotly-graph-card
#   • lovelace-mushroom (v5+)    https://github.com/piitaya/lovelace-mushroom
#   • card-mod                   https://github.com/thomasloven/lovelace-card-mod
#
# The four fermenter sections are identical apart from the fermenter number.
#

views:
  - title: Fermenters
    path: fermenters
    type: sections
    max_columns: 4
    sections:
      - type: grid
        column_span: 4
        cards:
          # Every controller entity goes unavailable when the device drops off MQTT
          - type: conditional
            grid_options:
              columns: full
            conditions:
              - condition: state
                entity: sensor.ourbrewbot_firmware_version
                state: unavailable
            card:
              type: custom:mushroom-template-card
              primary: Controller offline
              secondary: The OurBrewbot is not publishing to MQTT. Check power and Wi-Fi.
              icon: mdi:wifi-off
              color: red
              multiline_secondary: true
              card_mod:
                style: |
                  ha-card {
                    border: 2px solid var(--error-color);
                    animation: brewbot-blink 1s step-start infinite;
                  }
                  @keyframes brewbot-blink { 50% { opacity: 0.4; } }
          - type: custom:mushroom-chips-card
            alignment: center
            grid_options:
              columns: full
            chips:
              - type: template
                entity: sensor.ourbrewbot_firmware_version
                content: '{{ states(''sensor.ourbrewbot_firmware_version'') }}'
                icon: mdi:tag
                icon_color: grey
                tap_action:
                  action: none
              - type: conditional
                conditions:
                  - condition: state
                    entity: update.ourbrewbot_firmware
                    state: 'on'
                chip:
                  type: template
                  entity: update.ourbrewbot_firmware
                  content: >-
                    Update to {{ state_attr('update.ourbrewbot_firmware', 'latest_version') }}
                  icon: mdi:package-up
                  icon_color: orange
                  tap_action:
                    action: more-info
              - type: template
                entity: sensor.ourbrewbot_ip_address
                content: '{{ states(''sensor.ourbrewbot_ip_address'') }}'
                icon: mdi:ip-network
                icon_color: grey
                tap_action:
                  action: none
              - type: template
                entity: sensor.ourbrewbot_uptime
                content: >-
                  {%- set m = states('sensor.ourbrewbot_uptime') | int(0) -%}
                  {%- set d = m // 1440 -%}
                  {%- set h = (m % 1440) // 60 -%}
                  {%- set mn = m % 60 -%}
                  {%- if d > 0 -%} {{ d }}d {{ h }}h {{ mn }}m
                  {%- elif h > 0 -%} {{ h }}h {{ mn }}m
                  {%- else -%} {{ mn }}m
                  {%- endif -%}
                icon: mdi:clock-outline
                icon_color: grey
                tap_action:
                  action: none
              - type: template
                entity: sensor.ourbrewbot_rssi
                content: '{{ states(''sensor.ourbrewbot_rssi'') }} dBm'
                icon: mdi:wifi
                icon_color: >-
                  {%- set r = states('sensor.ourbrewbot_rssi') | int(-100) -%}
                  {%- if r > -60 -%} green
                  {%- elif r > -75 -%} orange
                  {%- else -%} red
                  {%- endif -%}
                tap_action:
                  action: none
              - type: template
                entity: sensor.ourbrewbot_free_heap
                content: >-
                  {{ (states('sensor.ourbrewbot_free_heap') | int(0) / 1024) | round(1) }} KB
                icon: mdi:memory
                icon_color: grey
                tap_action:
                  action: none
              - type: template
                content: Reboot
                icon: mdi:restart
                icon_color: grey
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.ourbrewbot_reboot
                  confirmation:
                    text: Reboot the OurBrewbot controller?
              - type: template
                content: All off
                icon: mdi:power-off
                icon_color: red
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.ourbrewbot_all_off
                  confirmation:
                    text: Press All Off on the OurBrewbot?
      - type: grid
        column_span: 4
        cards:
          - type: markdown
            text_only: true
            grid_options:
              columns: full
            content: |
              {%- set bad = ['unavailable', 'unknown', ''] -%}
              {%- set name = states('text.ourbrewbot_f0_name') -%}
              {%- set beer = states('text.ourbrewbot_f0_beer_name') -%}
              {%- set yeast = states('text.ourbrewbot_f0_yeast') -%}
              {%- set ts = states('sensor.ourbrewbot_f0_beer_temperature_source') -%}
              {%- set gs = states('sensor.ourbrewbot_f0_gravity_source') -%}
              # <center>{{ name if name not in bad else 'Fermenter 0' }}</center>
              {% if beer not in bad and yeast not in bad -%}
              ### <center>{{ beer }} · {{ yeast }}</center>
              {% elif beer not in bad -%}
              ### <center>{{ beer }}</center>
              {% else -%}
              ### <center>No beer loaded</center>
              {% endif %}
              <center>Temperature from {{ ts if ts not in bad else 'none' }} · Gravity from {{ gs if gs not in bad else 'none' }}
              {%- if is_state('switch.ourbrewbot_f0_profile_running', 'on') %} · Profile {{ states('select.ourbrewbot_f0_profile_no') }}, step {{ states('sensor.ourbrewbot_f0_profile_step') }} of {{ states('sensor.ourbrewbot_f0_profile_steps') }}{% endif %}</center>
          - type: conditional
            grid_options:
              columns: full
            conditions:
              - condition: state
                entity: binary_sensor.ourbrewbot_f0_alarm
                state: 'on'
            card:
              type: custom:mushroom-template-card
              entity: binary_sensor.ourbrewbot_f0_alarm
              primary: >-
                {%- set n = states('text.ourbrewbot_f0_name') -%}
                Alarm: {{ n if n not in ['unknown', 'unavailable', ''] else 'Fermenter 0' }}
              secondary: >-
                {%- set u = state_attr('sensor.ourbrewbot_f0_beer_temperature', 'unit_of_measurement') -%}
                Beer is {{ states('sensor.ourbrewbot_f0_beer_temperature') }} {{ u }}.
                Target range {{ states('number.ourbrewbot_f0_floor_temperature') }}–{{ states('number.ourbrewbot_f0_ceiling_temperature') }} {{ u }}.
              icon: mdi:alarm-light
              color: red
              multiline_secondary: true
              tap_action:
                action: more-info
              card_mod:
                style: |
                  ha-card {
                    border: 2px solid var(--error-color);
                    animation: brewbot-blink 1s step-start infinite;
                  }
                  0keyframes brewbot-blink { 50% { opacity: 0.4; } }
          - type: custom:plotly-graph
            grid_options:
              columns: full
            color_scheme: dutch_field
            title: >
              $fn ({ hass }) => hass.states['text.ourbrewbot_f0_name']?.state || 'Fermenter 0'
            defaults:
              entity:
                filters:
                  - force_numeric
            entities:
              - entity: number.ourbrewbot_f0_ceiling_temperature
                name: Ceiling
              - entity: number.ourbrewbot_f0_floor_temperature
                name: Floor
              - entity: sensor.ourbrewbot_f0_beer_temperature
                name: Beer Temp
                statistic: mean
                period: auto
                line:
                  width: 1
                  shape: spline
              - entity: sensor.ourbrewbot_f0_ambient_temperature
                name: Fridge Temp
                statistic: mean
                period: auto
                line:
                  width: 1
                  shape: spline
              - entity: number.ourbrewbot_f0_tg
                name: TG
                yaxis: y2
              - entity: number.ourbrewbot_f0_og
                name: OG
                yaxis: y2
              - entity: sensor.ourbrewbot_f0_gravity
                name: SG
                yaxis: y2
                statistic: mean
                period: auto
                line:
                  width: 1
                  shape: spline
            hours_to_show: 72
            refresh_interval: 10
            layout:
              yaxis:
                title:
                  text: Temperature
              yaxis2:
                title:
                  text: Gravity
                overlaying: 'y'
                side: right
              xaxis:
                rangeselector:
                  'y': 1.2
                  # Long-term statistics are 5-minute means at best, so no shorter ranges
                  buttons:
                    - count: 12
                      step: hour
                    - count: 1
                      step: day
                    - count: 7
                      step: day
                    - count: 14
                      step: day
              legend:
                x: 0
                y: -0.5
            autorange_after_scroll: true
          - type: custom:mushroom-template-card
            entity: sensor.ourbrewbot_f0_status
            primary: Status
            secondary: >-
              {{ states('sensor.ourbrewbot_f0_status') | title }}
              {{- ' · alarm on' if is_state('binary_sensor.ourbrewbot_f0_alarm', 'on') else '' }}
            icon: >-
              {%- set s = states('sensor.ourbrewbot_f0_status') -%}
              {%- if is_state('binary_sensor.ourbrewbot_f0_alarm', 'on') or s == 'alarm' -%} mdi:alert-circle
              {%- elif s == 'heating' -%} mdi:fire
              {%- elif s == 'cooling' -%} mdi:snowflake
              {%- elif s == 'idle' -%} mdi:check-circle-outline
              {%- else -%} mdi:help-circle-outline
              {%- endif -%}
            color: >-
              {%- set s = states('sensor.ourbrewbot_f0_status') -%}
              {%- if is_state('binary_sensor.ourbrewbot_f0_alarm', 'on') or s == 'alarm' -%} red
              {%- elif s == 'heating' -%} orange
              {%- elif s == 'cooling' -%} blue
              {%- elif s == 'idle' -%} green
              {%- else -%} grey
              {%- endif -%}
            tap_action:
              action: more-info
            grid_options:
              columns: 12
          - type: tile
            entity: sensor.ourbrewbot_f0_beer_temperature
            name: Beer temp
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.ourbrewbot_f0_ambient_temperature
            name: Ambient temp
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.ourbrewbot_f0_gravity
            name: Current SG
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.ourbrewbot_f0_attenuation
            name: Attenuation
            grid_options:
              columns: 6
          - type: custom:mushroom-template-card
            primary: Est. ABV
            secondary: >-
              {%- set og = states('number.ourbrewbot_f0_og') | float(0) -%}
              {%- set sg = states('sensor.ourbrewbot_f0_gravity') | float(0) -%}
              {%- if og > 0 and sg > 0 -%} {{ [0, (og - sg) * 131.25] | max | round(1) }} %
              {%- else -%} –
              {%- endif -%}
            icon: mdi:beer
            color: amber
            grid_options:
              columns: 6
          - type: custom:mushroom-template-card
            primary: Progress
            secondary: >-
              {%- set og = states('number.ourbrewbot_f0_og') | float(0) -%}
              {%- set sg = states('sensor.ourbrewbot_f0_gravity') | float(0) -%}
              {%- set tg = states('number.ourbrewbot_f0_tg') | float(0) -%}
              {%- if og > tg > 0 and sg > 0 -%} {{ ([0, [100, (og - sg) / (og - tg) * 100] | min] | max) | round(0) | int }} %
              {%- else -%} –
              {%- endif -%}
            icon: mdi:progress-clock
            color: >-
              {%- set og = states('number.ourbrewbot_f0_og') | float(0) -%}
              {%- set sg = states('sensor.ourbrewbot_f0_gravity') | float(0) -%}
              {%- set tg = states('number.ourbrewbot_f0_tg') | float(0) -%}
              {%- set p = (og - sg) / (og - tg) * 100 if og > tg > 0 and sg > 0 else -1 -%}
              {%- if p < 0 -%} grey
              {%- elif p < 50 -%} orange
              {%- elif p < 90 -%} yellow
              {%- else -%} green
              {%- endif -%}
            grid_options:
              columns: 6
          - type: tile
            entity: switch.ourbrewbot_f0_power
            name: Power
            features_position: inline
            features:
              - type: toggle
            grid_options:
              columns: 12
          - type: tile
            entity: switch.ourbrewbot_f0_temp_control
            name: Temp control
            features_position: inline
            features:
              - type: toggle
            grid_options:
              columns: 12
          - type: tile
            entity: switch.ourbrewbot_f0_profile_running
            name: Profile running
            features_position: inline
            features:
              - type: toggle
            grid_options:
              columns: 12
          - type: tile
            entity: select.ourbrewbot_f0_profile_no
            name: Profile
            features_position: inline
            features:
              - type: select-options
            grid_options:
              columns: 12
          - type: tile
            entity: number.ourbrewbot_f0_ceiling_temperature
            name: Ceiling
            features_position: inline
            features:
              - type: numeric-input
                style: buttons
            grid_options:
              columns: 12
          - type: tile
            entity: number.ourbrewbot_f0_floor_temperature
            name: Floor
            features_position: inline
            features:
              - type: numeric-input
                style: buttons
            grid_options:
              columns: 12
          - type: tile
            entity: number.ourbrewbot_f0_hysteresis
            name: Hysteresis
            features_position: inline
            features:
              - type: numeric-input
                style: buttons
            grid_options:
              columns: 12
          - type: tile
            entity: number.ourbrewbot_f0_compressor_delay
            name: Compressor delay
            features_position: inline
            features:
              - type: numeric-input
                style: buttons
            grid_options:
              columns: 12
          - type: tile
            entity: number.ourbrewbot_f0_og
            name: OG
            features_position: inline
            features:
              - type: numeric-input
                style: buttons
            grid_options:
              columns: 12
          - type: tile
            entity: number.ourbrewbot_f0_tg
            name: Target SG
            features_position: inline
            features:
              - type: numeric-input
                style: buttons
            grid_options:
              columns: 12
          - type: heading
            heading: Sensors
            heading_style: subtitle
            icon: mdi:access-point
          # Probes, Tilts and iSpindels assigned to this fermenter. The optional _2
          # suffix catches entities Home Assistant renamed after a re-discovery.
          - type: markdown
            grid_options:
              columns: full
            content: |
              {%- set ns = namespace(rows=[]) -%}
              {%- for s in states.sensor
                  | selectattr('entity_id', 'match', 'sensor.ourbrewbot_(tilt|ispindel|probe)_.*_fermenter(_2)?$')
                  | selectattr('state', 'eq', '0') -%}
              {%- set sfx = '_2' if s.entity_id.endswith('_2') else '' -%}
              {%- set stem = (s.entity_id[:-2] if sfx else s.entity_id) | replace('_fermenter', '') -%}
              {%- if '_tilt_' in stem -%}
              {%- set kind = 'Tilt' -%}
              {%- set name = 'Tilt ' ~ (stem | replace('sensor.ourbrewbot_tilt_', '') | title) -%}
              {%- elif '_ispindel_' in stem -%}
              {%- set kind = 'iSpindel' -%}
              {%- set name = states(stem ~ '_name' ~ sfx) -%}
              {%- else -%}
              {%- set kind = 'Probe (' ~ states(stem ~ '_function') ~ ')' -%}
              {%- set name = states(stem ~ '_name') -%}
              {%- endif -%}
              {%- set sg = states(stem ~ '_gravity' ~ sfx) -%}
              {%- set t = states(stem ~ '_temperature' ~ sfx) -%}
              {%- set u = state_attr(stem ~ '_temperature' ~ sfx, 'unit_of_measurement') or '' -%}
              {%- set ns.rows = ns.rows + [[name, kind,
                    sg if sg not in ['unknown', 'unavailable'] else '–',
                    t ~ ' ' ~ u if t not in ['unknown', 'unavailable'] else '–']] -%}
              {%- endfor -%}
              {%- if ns.rows -%}
              | Device | Type | SG | Temp |
              |---|---|---|---|
              {% for r in ns.rows | sort(attribute='0') -%}
              | {{ r[0] }} | {{ r[1] }} | {{ r[2] }} | {{ r[3] }} |
              {% endfor %}
              {%- else -%}
              No sensors assigned.
              {%- endif -%}
      - type: grid
        column_span: 4
        cards:
          - type: markdown
            text_only: true
            grid_options:
              columns: full
            content: |
              {%- set bad = ['unavailable', 'unknown', ''] -%}
              {%- set name = states('text.ourbrewbot_f1_name') -%}
              {%- set beer = states('text.ourbrewbot_f1_beer_name') -%}
              {%- set yeast = states('text.ourbrewbot_f1_yeast') -%}
              {%- set ts = states('sensor.ourbrewbot_f1_beer_temperature_source') -%}
              {%- set gs = states('sensor.ourbrewbot_f1_gravity_source') -%}
              # <center>{{ name if name not in bad else 'Fermenter 1' }}</center>
              {% if beer not in bad and yeast not in bad -%}
              ### <center>{{ beer }} · {{ yeast }}</center>
              {% elif beer not in bad -%}
              ### <center>{{ beer }}</center>
              {% else -%}
              ### <center>No beer loaded</center>
              {% endif %}
              <center>Temperature from {{ ts if ts not in bad else 'none' }} · Gravity from {{ gs if gs not in bad else 'none' }}
              {%- if is_state('switch.ourbrewbot_f1_profile_running', 'on') %} · Profile {{ states('select.ourbrewbot_f1_profile_no') }}, step {{ states('sensor.ourbrewbot_f1_profile_step') }} of {{ states('sensor.ourbrewbot_f1_profile_steps') }}{% endif %}</center>
          - type: conditional
            grid_options:
              columns: full
            conditions:
              - condition: state
                entity: binary_sensor.ourbrewbot_f1_alarm
                state: 'on'
            card:
              type: custom:mushroom-template-card
              entity: binary_sensor.ourbrewbot_f1_alarm
              primary: >-
                {%- set n = states('text.ourbrewbot_f1_name') -%}
                Alarm: {{ n if n not in ['unknown', 'unavailable', ''] else 'Fermenter 1' }}
              secondary: >-
                {%- set u = state_attr('sensor.ourbrewbot_f1_beer_temperature', 'unit_of_measurement') -%}
                Beer is {{ states('sensor.ourbrewbot_f1_beer_temperature') }} {{ u }}.
                Target range {{ states('number.ourbrewbot_f1_floor_temperature') }}–{{ states('number.ourbrewbot_f1_ceiling_temperature') }} {{ u }}.
              icon: mdi:alarm-light
              color: red
              multiline_secondary: true
              tap_action:
                action: more-info
              card_mod:
                style: |
                  ha-card {
                    border: 2px solid var(--error-color);
                    animation: brewbot-blink 1s step-start infinite;
                  }
                  1keyframes brewbot-blink { 50% { opacity: 0.4; } }
          - type: custom:plotly-graph
            grid_options:
              columns: full
            color_scheme: dutch_field
            title: >
              $fn ({ hass }) => hass.states['text.ourbrewbot_f1_name']?.state || 'Fermenter 1'
            defaults:
              entity:
                filters:
                  - force_numeric
            entities:
              - entity: number.ourbrewbot_f1_ceiling_temperature
                name: Ceiling
              - entity: number.ourbrewbot_f1_floor_temperature
                name: Floor
              - entity: sensor.ourbrewbot_f1_beer_temperature
                name: Beer Temp
                statistic: mean
                period: auto
                line:
                  width: 1
                  shape: spline
              - entity: sensor.ourbrewbot_f1_ambient_temperature
                name: Fridge Temp
                statistic: mean
                period: auto
                line:
                  width: 1
                  shape: spline
              - entity: number.ourbrewbot_f1_tg
                name: TG
                yaxis: y2
              - entity: number.ourbrewbot_f1_og
                name: OG
                yaxis: y2
              - entity: sensor.ourbrewbot_f1_gravity
                name: SG
                yaxis: y2
                statistic: mean
                period: auto
                line:
                  width: 1
                  shape: spline
            hours_to_show: 72
            refresh_interval: 10
            layout:
              yaxis:
                title:
                  text: Temperature
              yaxis2:
                title:
                  text: Gravity
                overlaying: 'y'
                side: right
              xaxis:
                rangeselector:
                  'y': 1.2
                  # Long-term statistics are 5-minute means at best, so no shorter ranges
                  buttons:
                    - count: 12
                      step: hour
                    - count: 1
                      step: day
                    - count: 7
                      step: day
                    - count: 14
                      step: day
              legend:
                x: 0
                y: -0.5
            autorange_after_scroll: true
          - type: custom:mushroom-template-card
            entity: sensor.ourbrewbot_f1_status
            primary: Status
            secondary: >-
              {{ states('sensor.ourbrewbot_f1_status') | title }}
              {{- ' · alarm on' if is_state('binary_sensor.ourbrewbot_f1_alarm', 'on') else '' }}
            icon: >-
              {%- set s = states('sensor.ourbrewbot_f1_status') -%}
              {%- if is_state('binary_sensor.ourbrewbot_f1_alarm', 'on') or s == 'alarm' -%} mdi:alert-circle
              {%- elif s == 'heating' -%} mdi:fire
              {%- elif s == 'cooling' -%} mdi:snowflake
              {%- elif s == 'idle' -%} mdi:check-circle-outline
              {%- else -%} mdi:help-circle-outline
              {%- endif -%}
            color: >-
              {%- set s = states('sensor.ourbrewbot_f1_status') -%}
              {%- if is_state('binary_sensor.ourbrewbot_f1_alarm', 'on') or s == 'alarm' -%} red
              {%- elif s == 'heating' -%} orange
              {%- elif s == 'cooling' -%} blue
              {%- elif s == 'idle' -%} green
              {%- else -%} grey
              {%- endif -%}
            tap_action:
              action: more-info
            grid_options:
              columns: 12
          - type: tile
            entity: sensor.ourbrewbot_f1_beer_temperature
            name: Beer temp
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.ourbrewbot_f1_ambient_temperature
            name: Ambient temp
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.ourbrewbot_f1_gravity
            name: Current SG
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.ourbrewbot_f1_attenuation
            name: Attenuation
            grid_options:
              columns: 6
          - type: custom:mushroom-template-card
            primary: Est. ABV
            secondary: >-
              {%- set og = states('number.ourbrewbot_f1_og') | float(0) -%}
              {%- set sg = states('sensor.ourbrewbot_f1_gravity') | float(0) -%}
              {%- if og > 0 and sg > 0 -%} {{ [0, (og - sg) * 131.25] | max | round(1) }} %
              {%- else -%} –
              {%- endif -%}
            icon: mdi:beer
            color: amber
            grid_options:
              columns: 6
          - type: custom:mushroom-template-card
            primary: Progress
            secondary: >-
              {%- set og = states('number.ourbrewbot_f1_og') | float(0) -%}
              {%- set sg = states('sensor.ourbrewbot_f1_gravity') | float(0) -%}
              {%- set tg = states('number.ourbrewbot_f1_tg') | float(0) -%}
              {%- if og > tg > 0 and sg > 0 -%} {{ ([0, [100, (og - sg) / (og - tg) * 100] | min] | max) | round(0) | int }} %
              {%- else -%} –
              {%- endif -%}
            icon: mdi:progress-clock
            color: >-
              {%- set og = states('number.ourbrewbot_f1_og') | float(0) -%}
              {%- set sg = states('sensor.ourbrewbot_f1_gravity') | float(0) -%}
              {%- set tg = states('number.ourbrewbot_f1_tg') | float(0) -%}
              {%- set p = (og - sg) / (og - tg) * 100 if og > tg > 0 and sg > 0 else -1 -%}
              {%- if p < 0 -%} grey
              {%- elif p < 50 -%} orange
              {%- elif p < 90 -%} yellow
              {%- else -%} green
              {%- endif -%}
            grid_options:
              columns: 6
          - type: tile
            entity: switch.ourbrewbot_f1_power
            name: Power
            features_position: inline
            features:
              - type: toggle
            grid_options:
              columns: 12
          - type: tile
            entity: switch.ourbrewbot_f1_temp_control
            name: Temp control
            features_position: inline
            features:
              - type: toggle
            grid_options:
              columns: 12
          - type: tile
