            grid_options:
              columns: 12
          - type: heading
            heading: Sensors
            heading_style: subtitle
            icon: mdi:access-point
          # Probes, Tilts and iSpindels assigned to this fermenter. The optional _2
          # suffix catches entities Home Assistant renamed after a re-discovery.
          - type: markdown
            grid_options:
              columns: full
            content: |
              {%- set ns = namespace(rows=[]) -%}
              {%- for s in states.sensor
                  | selectattr('entity_id', 'match', 'sensor.ourbrewbot_(tilt|ispindel|probe)_.*_fermenter(_2)?$')
                  | selectattr('state', 'eq', '3') -%}
              {%- set sfx = '_2' if s.entity_id.endswith('_2') else '' -%}
              {%- set stem = (s.entity_id[:-2] if sfx else s.entity_id) | replace('_fermenter', '') -%}
              {%- if '_tilt_' in stem -%}
              {%- set kind = 'Tilt' -%}
              {%- set name = 'Tilt ' ~ (stem | replace('sensor.ourbrewbot_tilt_', '') | title) -%}
              {%- elif '_ispindel_' in stem -%}
              {%- set kind = 'iSpindel' -%}
              {%- set name = states(stem ~ '_name' ~ sfx) -%}
              {%- else -%}
              {%- set kind = 'Probe (' ~ states(stem ~ '_function') ~ ')' -%}
              {%- set name = states(stem ~ '_name') -%}
              {%- endif -%}
              {%- set sg = states(stem ~ '_gravity' ~ sfx) -%}
              {%- set t = states(stem ~ '_temperature' ~ sfx) -%}
              {%- set u = state_attr(stem ~ '_temperature' ~ sfx, 'unit_of_measurement') or '' -%}
              {%- set ns.rows = ns.rows + [[name, kind,
                    sg if sg not in ['unknown', 'unavailable'] else '–',
                    t ~ ' ' ~ u if t not in ['unknown', 'unavailable'] else '–']] -%}
              {%- endfor -%}
              {%- if ns.rows -%}
              | Device | Type | SG | Temp |
              |---|---|---|---|
              {% for r in ns.rows | sort(attribute='0') -%}
              | {{ r[0] }} | {{ r[1] }} | {{ r[2] }} | {{ r[3] }} |
              {% endfor %}
              {%- else -%}
              No sensors assigned.
              {%- endif -%}
